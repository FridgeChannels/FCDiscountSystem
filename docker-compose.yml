name: fc-discount-system

services:
  engine:
    build:
      context: ..
      dockerfile: FCDiscountSystem/docker/engine.Dockerfile
    container_name: fc-engine
    environment:
      ENGINE_PORT: 8787
      FC_REPO: memory
      FC_CACHE: memory
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  bff:
    build:
      context: ..
      dockerfile: FCDiscountSystem/docker/bff.Dockerfile
    container_name: fc-bff
    environment:
      BFF_PORT: 3001
      ENGINE_BASE_URL: http://engine:8787
      ENGINE_TIMEOUT_MS: 30000
      FC_PLATFORM_ROOT: /workspace/fc-platform
      PLAN_CACHE_TTL_MS: 15000
      MANIFEST_TTL_SECONDS: 30
      MANIFEST_STABLE_VERSION: 1.0.0
      MANIFEST_CANARY_VERSION: 1.1.0
      MANIFEST_CANARY_RUNTIMES: DodgePlaneRuntime,BridgeCrossRuntime
      MANIFEST_CANARY_DEFAULT_PERCENT: 20
      MANIFEST_CANARY_ROLLOUTS: '{"DodgePlaneRuntime":20,"BridgeCrossRuntime":20}'
      MANIFEST_SIGNING_KEY_ID: docker-local
      MANIFEST_PRIVATE_KEY_PEM: ${MANIFEST_PRIVATE_KEY_PEM-}
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/api/fc/health"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: FCDiscountSystem/docker/web.Dockerfile
      args:
        VITE_API_BASE: /api/fc
        VITE_MANIFEST_PUBLIC_KEY_PEM: ${VITE_MANIFEST_PUBLIC_KEY_PEM-}
        VITE_MANIFEST_REQUIRE_SIGNATURE: ${VITE_MANIFEST_REQUIRE_SIGNATURE-false}
    container_name: fc-web
    ports:
      - "8080:80"
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped
