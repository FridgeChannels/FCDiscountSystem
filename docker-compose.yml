name: fc-discount-system

services:
  engine:
    build:
      context: ..
      dockerfile: FCDiscountSystem/docker/engine.Dockerfile
    container_name: fc-engine
    environment:
      ENGINE_PORT: 8787
      FC_REPO: ${FC_REPO:-memory}
      FC_CACHE: ${FC_CACHE:-memory}
      SUPABASE_URL: ${SUPABASE_URL-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY-}
      REDIS_URL: ${REDIS_URL-}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-fc:}
      RUNTIME_SHELL_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  platform-web:
    build:
      context: ..
      dockerfile: FCDiscountSystem/docker/platform-web.Dockerfile
    container_name: fc-platform-web
    environment:
      ENGINE_BASE_URL: http://engine:8787
      RUNTIME_SHELL_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      UPLOADED_GAMES_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SUPABASE_URL: ${SUPABASE_URL-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY-}
    volumes:
      - platform_uploaded_games:/workspace/fc-platform/apps/web/public/uploaded-games
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8789/admin/game-library"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  bff:
    build:
      context: ..
      dockerfile: FCDiscountSystem/docker/bff.Dockerfile
    container_name: fc-bff
    environment:
      BFF_PORT: 3001
      ENGINE_BASE_URL: http://engine:8787
      ENGINE_TIMEOUT_MS: 30000
      FC_PLATFORM_ROOT: /workspace/fc-platform
      PLAN_CACHE_TTL_MS: 15000
      RUNTIME_SHELL_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      MANIFEST_TTL_SECONDS: 30
      MANIFEST_SIGNING_KEY_ID: docker-local
      MANIFEST_PRIVATE_KEY_PEM: ${MANIFEST_PRIVATE_KEY_PEM-}
    depends_on:
      engine:
        condition: service_healthy
      platform-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/api/fc/health"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: FCDiscountSystem/docker/web.Dockerfile
      args:
        VITE_API_BASE: /api/fc
        VITE_RUNTIME_SHELL_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
        VITE_MANIFEST_PUBLIC_KEY_PEM: ${VITE_MANIFEST_PUBLIC_KEY_PEM-}
        VITE_MANIFEST_REQUIRE_SIGNATURE: ${VITE_MANIFEST_REQUIRE_SIGNATURE-false}
    container_name: fc-web
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    depends_on:
      bff:
        condition: service_healthy
      platform-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: unless-stopped

volumes:
  platform_uploaded_games:
